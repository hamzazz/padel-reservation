workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (Sideloadly)
    max_build_duration: 60
    environment:
      flutter: 3.24.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install

      - name: Build unsigned iOS
        script: |
          flutter build ios --release --no-codesign

      - name: Package as IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r PadelClub.ipa Payload
          rm -rf Payload

    artifacts:
      - PadelClub.ipa

    publishing:
      email:
        recipients:
          - elmezouarihamza@gmail.com
        notify:
          success: true
          failure: true
